name: Android APK

# ماذا تفعل:
#  1) اختبارات الوحدة (JUnit) وفحص اللمس (Lint).
#  2) بناء APK تجريبي (debug) وإصداري (release).
#  3) رفع كل APK كأرتيفكت قابل للتنزيل من صفحة الإجراء.
#
# التوقيع اختياري: إن أضفت Secrets باسم AQ_KEYSTORE (Base64) وAQ_KEYSTORE_PASS
# وAQ_KEY_ALIAS وAQ_KEY_PASS يُوقّع الإصدار بها، وإلا يُبنى APK غير موقّع.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional secrets)
        env:
          AQ_KEYSTORE: ${{ secrets.AQ_KEYSTORE }}
          AQ_KEYSTORE_PASS: ${{ secrets.AQ_KEYSTORE_PASS }}
          AQ_KEY_ALIAS: ${{ secrets.AQ_KEY_ALIAS }}
          AQ_KEY_PASS: ${{ secrets.AQ_KEY_PASS }}
        run: |
          if [ -n "$AQ_KEYSTORE" ]; then
            echo "$AQ_KEYSTORE" | base64 -d > app/release.keystore
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/app/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$AQ_KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${AQ_KEY_ALIAS:-aqlni}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$AQ_KEY_PASS" >> "$GITHUB_ENV"
            echo "🔑 Keystore decoded: signed release APK"
          else
            echo "ℹ️ No AQ_KEYSTORE secret: release APK will be unsigned"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug & release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aqlni-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aqlni-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
